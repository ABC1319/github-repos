name: Export GitHub Repos

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - run: pip install requests openpyxl

    - name: Export GitHub Repos
      env:
        GITHUB_USERNAME: ${{ secrets.GH_USERNAME }}
        GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        mkdir -p ./dist
        python export.py --output ./dist --formats json,csv,xlsx,html
        cp ./dist/repos.json ./repos.json
        cp ./dist/repos.csv ./repos.csv
        cp ./dist/repos.xlsx ./repos.xlsx
        cp ./dist/index.html ./index.html

    - name: Commit data files to main
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add dist/ repos.json repos.csv repos.xlsx index.html
        git diff --staged --quiet && echo "无变更，跳过提交" && exit 0
        git commit -m "chore: update GitHub Repos export"
        git pull --rebase origin ${{ github.ref_name }}
        git push origin HEAD

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
