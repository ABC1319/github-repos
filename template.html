<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{USERNAME}} 的 GitHub 仓库导航</title>
<style>
:root {
  --bg: #f6f8fa;
  --card-bg: #ffffff;
  --text: #24292f;
  --text-secondary: #57606a;
  --border: #d0d7de;
  --accent: #0969da;
  --accent-hover: #0550ae;
  --star: #e3b341;
  --fork: #7d8590;
  --private: #cf222e;
  --shadow: 0 1px 3px rgba(27,31,35,0.04), 0 1px 2px rgba(27,31,35,0.04);
  --radius: 12px;
}
[data-theme="dark"] {
  --bg: #0d1117;
  --card-bg: #161b22;
  --text: #c9d1d9;
  --text-secondary: #8b949e;
  --border: #30363d;
  --accent: #58a6ff;
  --accent-hover: #79c0ff;
  --star: #e3b341;
  --fork: #8b949e;
  --private: #f85149;
  --shadow: 0 1px 3px rgba(0,0,0,0.3);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
}
.container { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }
header {
  text-align: center;
  padding: 48px 16px 32px;
  position: relative;
}
header h1 { font-size: 2.2rem; font-weight: 700; margin-bottom: 8px; }
header p { color: var(--text-secondary); font-size: 1.05rem; }
.avatar {
  width: 80px; height: 80px; border-radius: 50%;
  border: 3px solid var(--border);
  margin-bottom: 16px;
  object-fit: cover;
}
.stats-bar {
  display: flex; justify-content: center; gap: 24px;
  margin: 24px 0; flex-wrap: wrap;
}
.stat-item { text-align: center; padding: 8px 16px; }
.stat-item .num { font-size: 1.6rem; font-weight: 700; color: var(--accent); }
.stat-item .label { font-size: 0.85rem; color: var(--text-secondary); }

.toolbar {
  display: flex; gap: 12px; flex-wrap: wrap;
  align-items: center; justify-content: center;
  margin: 24px 0 16px;
  padding: 16px;
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  position: sticky; top: 0; z-index: 100;
}
.search-box {
  position: relative; flex: 1; min-width: 240px; max-width: 400px;
}
.search-box input {
  width: 100%; padding: 10px 14px 10px 38px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--text);
  font-size: 0.95rem; outline: none;
  transition: border-color 0.2s;
}
.search-box input:focus { border-color: var(--accent); }
.search-box svg {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; fill: var(--text-secondary);
}
.search-hint {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  font-size: 0.75rem; color: var(--text-secondary);
  background: var(--card-bg); padding: 2px 6px; border-radius: 4px;
  border: 1px solid var(--border);
}
select, button {
  padding: 10px 14px; border: 1px solid var(--border);
  border-radius: 8px; background: var(--bg); color: var(--text);
  font-size: 0.9rem; cursor: pointer; outline: none;
  transition: all 0.2s;
}
select:hover, button:hover { border-color: var(--accent); }
button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.lang-filters {
  display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
  margin-bottom: 24px;
}
.lang-chip {
  padding: 6px 14px; border-radius: 20px;
  border: 1px solid var(--border); background: var(--card-bg);
  font-size: 0.85rem; cursor: pointer; transition: all 0.2s;
  color: var(--text);
}
.lang-chip:hover { border-color: var(--accent); }
.lang-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.lang-chip .count { font-size: 0.75rem; opacity: 0.7; margin-left: 4px; }

.repo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px;
}
.repo-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  transition: transform 0.2s, box-shadow 0.2s;
  display: flex; flex-direction: column;
}
.repo-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.08);
}
.repo-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 10px;
}
.repo-name {
  font-size: 1.1rem; font-weight: 600;
  color: var(--accent); text-decoration: none;
  word-break: break-all;
}
.repo-name:hover { text-decoration: underline; }
.repo-fork {
  font-size: 0.75rem; color: var(--text-secondary);
  border: 1px solid var(--border); padding: 2px 8px;
  border-radius: 12px; margin-left: 8px; white-space: nowrap;
}
.repo-private {
  font-size: 0.75rem; color: var(--private);
  border: 1px solid var(--private); padding: 2px 8px;
  border-radius: 12px; margin-left: 8px; white-space: nowrap;
}
.repo-desc {
  color: var(--text-secondary); font-size: 0.9rem;
  margin-bottom: 12px; flex: 1;
  display: -webkit-box; -webkit-line-clamp: 3;
  -webkit-box-orient: vertical; overflow: hidden;
}
.repo-meta {
  display: flex; align-items: center; gap: 16px;
  flex-wrap: wrap; font-size: 0.85rem;
  color: var(--text-secondary);
}
.repo-meta span { display: inline-flex; align-items: center; gap: 4px; }
.lang-dot {
  width: 10px; height: 10px; border-radius: 50%;
  display: inline-block;
}
.repo-topics {
  display: flex; gap: 6px; flex-wrap: wrap;
  margin-top: 10px;
}
.topic-tag {
  font-size: 0.75rem; color: var(--accent);
  background: rgba(9,105,218,0.08);
  padding: 3px 10px; border-radius: 12px;
}
[data-theme="dark"] .topic-tag {
  background: rgba(88,166,255,0.12);
}
.highlight { background: rgba(9,105,218,0.15); border-radius: 2px; padding: 0 2px; }
[data-theme="dark"] .highlight { background: rgba(88,166,255,0.25); }

.empty-state {
  text-align: center; padding: 60px 20px;
  color: var(--text-secondary);
}
.empty-state svg { width: 64px; height: 64px; margin-bottom: 16px; fill: var(--border); }

#backTop {
  position: fixed; bottom: 24px; right: 24px;
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--accent); color: #fff;
  border: none; cursor: pointer; display: none;
  align-items: center; justify-content: center;
  box-shadow: 0 4px 12px rgba(9,105,218,0.3);
  transition: opacity 0.3s, transform 0.2s;
  z-index: 200;
}
#backTop:hover { transform: scale(1.1); }
#backTop.show { display: flex; }

.theme-toggle {
  position: fixed; top: 16px; right: 16px;
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--card-bg); border: 1px solid var(--border);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow); z-index: 200;
  transition: transform 0.2s;
}
.theme-toggle:hover { transform: rotate(20deg); }
.theme-toggle svg { width: 20px; height: 20px; fill: var(--text); }

.footer {
  text-align: center; padding: 40px 16px;
  color: var(--text-secondary); font-size: 0.85rem;
}
.footer a { color: var(--accent); text-decoration: none; }

@media (max-width: 640px) {
  header h1 { font-size: 1.6rem; }
  .toolbar { flex-direction: column; align-items: stretch; }
  .search-box { max-width: 100%; }
  .repo-grid { grid-template-columns: 1fr; }
  .stats-bar { gap: 16px; }
}
</style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()" title="切换主题">
  <svg id="moon-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  <svg id="sun-icon" viewBox="0 0 24 24" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
</button>

<div class="container">
<header>
  <img class="avatar" src="https://github.com/{{USERNAME}}.png" alt="{{USERNAME}}" onerror="this.style.display='none'">
  <h1>🚀 {{USERNAME}} 的 GitHub 仓库</h1>
  <p>共 {{TOTAL}} 个仓库 · 实时搜索 · 多维度排序 · 一键筛选</p>
  <div class="stats-bar">
    <div class="stat-item"><div class="num">{{TOTAL}}</div><div class="label">仓库</div></div>
    <div class="stat-item"><div class="num">{{STARS}}</div><div class="label">Stars</div></div>
    <div class="stat-item"><div class="num">{{FORKS}}</div><div class="label">Forks</div></div>
    <div class="stat-item"><div class="num">{{PRIVATE}}</div><div class="label">私有</div></div>
    <div class="stat-item"><div class="num">{{LANGS}}</div><div class="label">语言</div></div>
  </div>
</header>

<div class="toolbar">
  <div class="search-box">
    <svg viewBox="0 0 16 16"><path d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215ZM11 6.5a4.499 4.499 0 1 0-8.997 0A4.499 4.499 0 0 0 11 6.5Z"/></svg>
    <input type="text" id="searchInput" placeholder="搜索仓库名称、描述、Topics、语言..." autocomplete="off">
    <span class="search-hint">Ctrl+K</span>
  </div>
  <select id="sortSelect">
    <option value="updated">默认（更新时间）</option>
    <option value="stars">星标数</option>
    <option value="name">名称</option>
    <option value="created">创建时间</option>
  </select>
</div>

<div class="lang-filters" id="langFilters"></div>

<div id="repoGrid" class="repo-grid"></div>

<div class="empty-state" id="emptyState" style="display:none">
  <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
  <p>没有找到匹配的仓库</p>
</div>

<div class="footer">
  <p>由 <a href="https://github.com/{{USERNAME}}" target="_blank">@{{USERNAME}}</a> 生成 · 
  <a href="https://github.com/{{USERNAME}}/github-repos" target="_blank">github-repos</a> 风格</p>
  <p style="margin-top:4px;opacity:0.7">生成时间：{{TIME}}</p>
</div>
</div>

<button id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
</button>

<script>
console.log("[GitHub Repos] 正在加载数据...");
const repos = {{JS_DATA}};
console.log("[GitHub Repos] 数据加载完成，共 " + repos.length + " 个仓库");

const langColors = {
  JavaScript: '#f1e05a', TypeScript: '#2b7489', Python: '#3572A5', HTML: '#e34c26',
  CSS: '#563d7c', Java: '#b07219', 'C++': '#f34b7d', C: '#555555', 'C#': '#178600',
  Go: '#00ADD8', Rust: '#dea584', Ruby: '#701516', PHP: '#4F5D95', Swift: '#ffac45',
  Kotlin: '#A97BFF', Vue: '#41b883', Shell: '#89e051', Dart: '#00B4AB',
  R: '#198CE7', Scala: '#c22d40', Perl: '#0298c3', Lua: '#000080',
  Jupyter: '#DA5B0B', Dockerfile: '#384d54'
};
let currentLang = 'all';
let currentSort = 'updated';
let currentQuery = '';

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function highlight(text, query) {
  if (!query) return escapeHtml(text);
  var safe = escapeHtml(text);
  var lowerText = safe.toLowerCase();
  var lowerQuery = query.toLowerCase();
  var result = '';
  var lastIndex = 0;
  var idx;
  while ((idx = lowerText.indexOf(lowerQuery, lastIndex)) !== -1) {
    result += safe.substring(lastIndex, idx);
    result += '<span class="highlight">' + safe.substring(idx, idx + query.length) + '</span>';
    lastIndex = idx + query.length;
  }
  result += safe.substring(lastIndex);
  return result;
}

function formatDate(d) {
  if (!d) return '';
  return d.slice(0, 10);
}

function getLangColor(lang) {
  return langColors[lang] || '#8b949e';
}

function renderLangFilters() {
  var counts = {};
  repos.forEach(function(r) {
    var l = r.language || 'Unknown';
    counts[l] = (counts[l] || 0) + 1;
  });
  var sorted = Object.entries(counts).sort(function(a,b) { return b[1] - a[1]; });
  var container = document.getElementById('langFilters');
  var html = '<button class="lang-chip ' + (currentLang === 'all' ? 'active' : '') + '" onclick="setLang(\'all\')">全部<span class="count">' + repos.length + '</span></button>';
  sorted.forEach(function(item) {
    var lang = item[0], count = item[1];
    html += '<button class="lang-chip ' + (currentLang === lang ? 'active' : '') + '" onclick="setLang(' + JSON.stringify(lang) + ')">' + escapeHtml(lang) + '<span class="count">' + count + '</span></button>';
  });
  container.innerHTML = html;
}

function getFiltered() {
  var list = repos.filter(function(r) {
    if (currentLang !== 'all' && (r.language || 'Unknown') !== currentLang) return false;
    if (!currentQuery) return true;
    var q = currentQuery.toLowerCase();
    return (r.name || '').toLowerCase().indexOf(q) !== -1 ||
           (r.description || '').toLowerCase().indexOf(q) !== -1 ||
           (r.topics || '').toLowerCase().indexOf(q) !== -1 ||
           (r.language || '').toLowerCase().indexOf(q) !== -1 ||
           (r.owner_login || '').toLowerCase().indexOf(q) !== -1;
  });
  list.sort(function(a, b) {
    if (currentSort === 'stars') return b.stargazers_count - a.stargazers_count;
    if (currentSort === 'name') return a.name.localeCompare(b.name);
    if (currentSort === 'created') return b.created_at.localeCompare(a.created_at);
    return b.updated_at.localeCompare(a.updated_at);
  });
  return list;
}

function render() {
  var list = getFiltered();
  var grid = document.getElementById('repoGrid');
  var empty = document.getElementById('emptyState');
  console.log("[GitHub Repos] 渲染 " + list.length + " 个仓库");
  if (list.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  grid.innerHTML = list.map(function(r) {
    var topics = r.topics ? r.topics.split(', ').filter(function(t) { return t; }) : [];
    var forkBadge = r.is_fork ? '<span class="repo-fork">Fork</span>' : '';
    var privateBadge = r.is_private ? '<span class="repo-private">Private</span>' : '';
    var langDot = r.language ? '<span class="lang-dot" style="background:' + getLangColor(r.language) + '"></span>' : '';
    var descHtml = r.description ? highlight(r.description, currentQuery) : '<i style="opacity:0.5">暂无描述</i>';
    var langHtml = r.language ? '<span>' + langDot + highlight(r.language, currentQuery) + '</span>' : '';
    var topicsHtml = topics.length ? '<div class="repo-topics">' + topics.map(function(t) {
      return '<span class="topic-tag">' + highlight(t, currentQuery) + '</span>';
    }).join('') + '</div>' : '';
    return '<div class="repo-card">' +
      '<div class="repo-header">' +
        '<div style="display:flex;align-items:center;flex-wrap:wrap;gap:4px;">' +
          '<a class="repo-name" href="' + r.html_url + '" target="_blank" rel="noopener">' + highlight(r.name, currentQuery) + '</a>' +
          forkBadge + privateBadge +
        '</div>' +
      '</div>' +
      '<div class="repo-desc">' + descHtml + '</div>' +
      '<div class="repo-meta">' +
        langHtml +
        '<span>⭐ ' + r.stargazers_count + '</span>' +
        '<span>🍴 ' + r.forks_count + '</span>' +
        '<span>📅 ' + formatDate(r.updated_at) + '</span>' +
      '</div>' +
      topicsHtml +
    '</div>';
  }).join('');
}

function setLang(lang) {
  currentLang = lang;
  renderLangFilters();
  render();
}

document.getElementById('searchInput').addEventListener('input', function(e) {
  currentQuery = e.target.value;
  render();
});
document.getElementById('sortSelect').addEventListener('change', function(e) {
  currentSort = e.target.value;
  render();
});
document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
  if (e.key === 'Escape') {
    document.getElementById('searchInput').value = '';
    currentQuery = '';
    render();
  }
});

window.addEventListener('scroll', function() {
  var btn = document.getElementById('backTop');
  if (window.scrollY > 300) btn.classList.add('show');
  else btn.classList.remove('show');
});

function toggleTheme() {
  var html = document.documentElement;
  var isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  localStorage.setItem('theme', isDark ? 'light' : 'dark');
  document.getElementById('moon-icon').style.display = isDark ? 'block' : 'none';
  document.getElementById('sun-icon').style.display = isDark ? 'none' : 'block';
}
(function initTheme() {
  var saved = localStorage.getItem('theme');
  var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  var isDark = saved ? saved === 'dark' : prefersDark;
  if (isDark) {
    document.documentElement.setAttribute('data-theme', 'dark');
    document.getElementById('moon-icon').style.display = 'none';
    document.getElementById('sun-icon').style.display = 'block';
  }
})();

renderLangFilters();
render();
</script>
</body>
</html>
